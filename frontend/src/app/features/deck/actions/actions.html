<!--
  At 360px the five ratings sit in a 3×2 grid; from `md` they open into a single
  row of five. One row of five at phone width leaves each label about 14
  characters of room in a column narrower than a thumb, which is an unreadable
  label rather than a compact one — the words are the label, so they get the
  room. The ragged last row (3 + 2) is the point: two short rows of words read
  as words, five slivers read as decoration. Every button keeps its 44px minimum
  either way (FR-017), so the grid stays reachable without aiming.

  Each cell is a glyph over its word. The word stays because it is the label the
  visitor is recording — "Disliked" and "Not Interested" are a real distinction
  and a shapes-only bar would make the visitor guess which is which. The icons
  are `aria-hidden`, so a screen reader hears the label and not the graphic.
-->
<div class="grid grid-cols-3 gap-1.5 md:grid-cols-5">
  @for (action of ratings; track action.state) {
    <button
      type="button"
      class="touch-target flex flex-col items-center justify-center gap-1 rounded-xl border border-ink-700 bg-ink-900 px-0.5 py-1 text-center text-xs leading-tight font-medium text-chalk-300 hover:bg-ink-800 active:border-accent-400 active:bg-ink-800"
      (click)="ratingChosen.emit(action.state)"
    >
      <!-- `d` as an attribute binding, never `[innerHTML]`: the sanitizer strips `svg`. -->
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        class="h-5 w-5 shrink-0"
      >
        <path [attr.d]="icons[action.state]" />
      </svg>
      {{ action.label }}
    </button>
  }
</div>

<div class="mt-2 flex items-center gap-2">
  <button
    type="button"
    class="touch-target inline-flex items-center justify-center rounded-full border border-ink-600 px-5 font-medium text-chalk-300"
    (click)="skipped.emit()"
  >
    Skip
  </button>

  <!-- The product's headline action, so it takes the room that is left. -->
  <button
    type="button"
    class="touch-target inline-flex flex-1 items-center justify-center rounded-full bg-accent-600 px-6 font-semibold text-white hover:bg-accent-500 active:brightness-90"
    (click)="watchNow.emit()"
  >
    {{ 'Watch Now' }}
  </button>
</div>
