<!--
  Four controls in two rows: the two verdicts the bar offers — Liked It and
  Disliked — Skip completing that row, then Watch Now full width beneath it.

  The shape is the 2026-09-29 two-verdict pass, kept: the narrowing became the
  contract on 2026-09-30, when `RATING_ACTIONS` dropped the three weaker
  states. See `actions.ts` for what that leaves in the vocabulary.

  Skip shares the tiles' box so the row reads as one bar — same height, same
  border, same label size — but it is deliberately not *drawn* as one of them.
  Every cell in the row now carries a glyph, so the separation had to move from
  presence to *kind*: the verdicts are closed objects (a thumb up, a thumb down)
  and Skip is `ICON_NEXT`, two open strokes pointing right. In a row of
  opinions an arrow reads as navigation, which is what Skip is. That is the
  whole of the separation: no dashed border, no colour the design system does
  not already have. The risk it answers is real — the third cell of a verdict
  row will be read as a third verdict — and the cost of not answering it is a
  visitor who thinks they have disliked a title they only skipped.

  Each verdict cell is a glyph over its word. The word stays because it is the
  label the visitor is recording, and a shapes-only bar would make the visitor
  guess. The icons are `aria-hidden`, so a screen reader hears the label and not
  the graphic. Every control keeps its 44px minimum (FR-017).
-->
<div class="grid grid-cols-3 gap-1.5">
  @for (action of ratings; track action.state) {
    <button
      type="button"
      class="touch-target flex flex-col items-center justify-center gap-1 rounded-xl border border-ink-700 bg-ink-900 px-0.5 py-1 text-center text-xs leading-tight font-medium text-chalk-300 hover:bg-ink-800 active:border-accent-400 active:bg-ink-800"
      (click)="ratingChosen.emit(action.state)"
    >
      <!-- `d` as an attribute binding, never `[innerHTML]`: the sanitizer strips `svg`. -->
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        class="h-5 w-5 shrink-0"
      >
        <path [attr.d]="icons[action.state]" />
      </svg>
      {{ action.label }}
    </button>
  }

  <!--
    The neutral answer, and the only cell in this row that records nothing. It
    is built exactly like a verdict cell — same box, same glyph over the same
    word — because the difference is carried by the glyph itself, not by the
    cell around it. See the header comment.
  -->
  <button
    type="button"
    class="touch-target flex flex-col items-center justify-center gap-1 rounded-xl border border-ink-700 bg-ink-900 px-0.5 py-1 text-center text-xs leading-tight font-medium text-chalk-300 hover:bg-ink-800 active:bg-ink-800"
    (click)="skipped.emit()"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      class="h-5 w-5 shrink-0"
    >
      <path [attr.d]="nextIcon" />
    </svg>
    Skip
  </button>
</div>

<!-- The product's headline action, and the only filled button in the bar. -->
<button
  type="button"
  class="touch-target mt-2 inline-flex w-full items-center justify-center rounded-full bg-accent-600 px-6 font-semibold text-white hover:bg-accent-500 active:brightness-90"
  (click)="watchNow.emit()"
>
  {{ 'Watch Now' }}
</button>
