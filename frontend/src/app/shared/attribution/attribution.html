<!--
  One link, because both halves go to the same place, and `target="_blank"`
  with `rel="noopener noreferrer"` for the reason every other outbound link in
  this app has it: an installed PWA has no browser chrome, so a same-tab
  navigation leaves the visitor with no way back (constitution II).

  The logo is deliberately small and muted — one row with the sentence rather
  than a stack of two, because the footer it sits in competes with the card for
  the same screen. §3 requires it to be *less
  prominent* than the marks that identify this app — it identifies the data
  source, not the product — but it does require it: the logo is not optional,
  so it shrinks rather than goes.

  The row reads left to right and the logo takes the first line with the text.
  Centred, an 8px logo floats at the vertical middle of a sentence that wraps
  to three lines on a phone, which reads as a stray mark rather than as the
  mark it is. `items-start` plus the logo's own nudge seats it on the first
  line's baseline; the sentence itself is too long to sit beside it on one
  line at 360px, so it wraps under and the mark stays where it is.

  The sentence below is on one line on purpose. Wrapped, the newline and its
  indentation become part of the text node, so the rendered sentence would
  carry whitespace the terms do not have — the kind of difference that survives
  review because the page still *looks* right.
-->
<a
  class="flex flex-wrap items-start justify-start gap-1 text-left no-underline"
  href="https://www.themoviedb.org/"
  target="_blank"
  rel="noopener noreferrer"
>
  <img src="tmdb-logo.svg" alt="TMDB" class="mt-0.5 h-2 w-auto shrink-0 opacity-75" />
  <span class="text-[9px] leading-tight text-chalk-500 underline-offset-2 hover:underline">This application uses TMDB and the TMDB APIs but is not endorsed, certified, or otherwise approved by TMDB.</span>
</a>
