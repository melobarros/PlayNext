<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PlayNext</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Stop scrolling, start watching — a 30-second quiz and a swipeable deck of titles you can actually stream." />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!--
      Google Identity Services, for the sign-in popup (research D5). async+defer
      so it never blocks the first paint: a guest who never opens Profile should
      not wait on a third-party script to see the quiz.
    -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
